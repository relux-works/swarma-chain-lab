# Temporary, reviewed wallet access for this VM-only regtest smoke.
# Install only as namecoind-regtest.service.d/commissioning.conf; remove before enablement.
[Service]
# Reset the production command, retaining every isolation and hardening option.
ExecStart=
# Keep RPC arguments/name values out of debug files and the journal.
ExecStart=/opt/namecoin/28.0/bin/namecoind -conf=/etc/namecoin/notary1-regtest.conf -datadir=/var/lib/namecoind-regtest -nosettings -regtest=1 -server=1 -daemon=0 -disablewallet=0 -fallbackfee=0.001 -listen=0 -connect=0 -dnsseed=0 -fixedseeds=0 -discover=0 -upnp=0 -natpmp=0 -onion=0 -rpcbind=127.0.0.1 -rpcallowip=127.0.0.1 -rpcport=18443 -rpccookiefile=/run/namecoind-regtest/.cookie -rpccookieperms=group -namehistory=1 -txindex=1 -nodebuglogfile -printtoconsole=0
