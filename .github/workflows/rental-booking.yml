name: Rental booking checks

on:
  pull_request:
    paths:
      - 'go.work'
      - 'go.work.sum'
      - 'deploy/workspace/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/rental-booking.yml'
  push:
    branches: [main]
    paths:
      - 'go.work'
      - 'go.work.sum'
      - 'deploy/workspace/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/rental-booking.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  booking:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/rental-booking
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Fetch and verify pinned modules
        run: |
          go mod download
          go mod verify
      - name: Unit, loopback protocol and frozen wire checks
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          go test -race ./...
          go build -trimpath ./cmd/...

      - name: V2 HTTP, CLI and outbox guard controls
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
          GOWORK: ${{ github.workspace }}/go.work
        run: |
          mkdir -p .temp
          M3_MUTATIONS=1 M3_MUTATION_ROOT="$PWD/.temp/bg1-http-controls" go test -count=1 -run '^TestGuardRemovalControls/(v2-http-origin|v2-service-version|outbox-prefix|outbox-bytes)$' .
