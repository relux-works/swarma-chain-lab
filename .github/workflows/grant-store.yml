name: Grant store checks

on:
  pull_request:
    paths:
      - 'go.work'
      - 'go.work.sum'
      - 'deploy/workspace/**'
      - 'experiments/model-proxy/**'
      - 'experiments/grant-store/**'
      - 'experiments/rental/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/rental-gateway/nostr/**'
      - 'experiments/rental-gateway/go.*'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/grant-store.yml'
  push:
    branches: [main]
    paths:
      - 'go.work'
      - 'go.work.sum'
      - 'deploy/workspace/**'
      - 'experiments/model-proxy/**'
      - 'experiments/grant-store/**'
      - 'experiments/rental/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/rental-gateway/nostr/**'
      - 'experiments/rental-gateway/go.*'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/grant-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/grant-store
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Fetch and verify pinned modules
        run: |
          go mod download
          go mod verify
      - name: Vet, race tests, CLI and guard controls
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
          GOWORK: ${{ github.workspace }}/go.work
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -trimpath -o ../../.temp/grant-store ./cmd/grant-store
          go run .scripts/guard-controls.go -out .temp/guards
