name: Notary checker and service

on:
  pull_request:
    paths:
      - 'experiments/notary-checker/**'
      - '.github/workflows/notary-checker.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/notary-checker/**'
      - '.github/workflows/notary-checker.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  notary-checker-service:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/notary-checker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.26.10'
          check-latest: false
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race -timeout 120s ./...
      - name: Reproducible service build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p .temp
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o .temp/notary-service-a ./cmd/notary-service
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o .temp/notary-service-b ./cmd/notary-service
          cmp .temp/notary-service-a .temp/notary-service-b
          sha256sum .temp/notary-service-a .temp/notary-service-b
      - name: Signing refusal control
        run: python3 -B scripts/check-service-mutant.py --work-dir .temp/service-mutant
      - name: Offline release verifier controls
        run: |
          scratch=$(mktemp -d /tmp/notary-release.XXXXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export HOME="$scratch/home" GOCACHE="$scratch/go-build"
          export GOMODCACHE="$scratch/go-mod" GOPATH="$scratch/go-path" TMPDIR="$scratch/tmp"
          export XDG_CONFIG_HOME="$scratch/config" XDG_CACHE_HOME="$scratch/cache"
          export GOTOOLCHAIN=local GOFLAGS=-mod=readonly GOPROXY=off GOSUMDB=off
          mkdir -p "$HOME" "$GOCACHE" "$GOMODCACHE" "$GOPATH" "$TMPDIR" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          bash -n scripts/verify-release.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/verify-release.sh
          else
            printf '%s\n' 'shellcheck is not installed'
          fi
          python3 -B scripts/test-verify-release.py
          python3 -B scripts/check-release-mutant.py --work-dir "$scratch/release-mutants"
      - name: Independent vectors
        run: python3 -B scripts/reference.py
