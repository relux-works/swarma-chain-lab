name: Grant checker checks

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local

on:
  pull_request:
    paths:
      - 'experiments/model-proxy/**'
      - 'experiments/grantcheck/**'
      - 'experiments/notary-checker/**'
      - 'experiments/rental/**'
      - 'experiments/rental-gateway/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/grantcheck.yml'
      - '.scripts/identity-interop/**'
      - '.scripts/regenerate-identity-interop.sh'
  push:
    branches: [main]
    paths:
      - 'experiments/model-proxy/**'
      - 'experiments/grantcheck/**'
      - 'experiments/notary-checker/**'
      - 'experiments/rental/**'
      - 'experiments/rental-gateway/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/grantcheck.yml'
      - '.scripts/identity-interop/**'
      - '.scripts/regenerate-identity-interop.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/grantcheck
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Fetch and verify pinned modules
        run: |
          go mod download
          go mod verify
      # Core vectors require separately provisioned pinned binaries and stay
      # opt-in. This lane runs unit/race tests and non-Core guard controls.
      - name: Vet, race tests, build and guard controls
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          CG1_REGTEST: '0'
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -trimpath ./...
          go run .scripts/guards.go -out .temp/guards
          go run .scripts/sender-guards.go -out .temp/sender-guards

  identity-issuer-bytes:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.10'
          check-latest: false
          cache: false
      - name: Re-export from pinned public issuer and compare every byte
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/.temp/identity-interop-regenerated"
          corpus="$GITHUB_WORKSPACE/experiments/grantcheck/testdata/identity-interop"
          bash .scripts/regenerate-identity-interop.sh "$output"
          # Equal manifests pin the entire produced set, including all 12 outcomes.
          cmp "$corpus/SHA256SUMS" "$output/SHA256SUMS"
          for generated in "$output"/*; do
            cmp "$corpus/${generated##*/}" "$generated"
          done
          cd "$output"
          sha256sum -c "$corpus/SHA256SUMS"
