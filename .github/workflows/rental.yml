name: Rental and single-use checks

on:
  pull_request:
    paths:
      - 'experiments/rental/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/rental.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/rental/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/rental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.module }} checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [rental, single-use, payment-chain]
    defaults:
      run:
        working-directory: experiments/${{ matrix.module }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Fetch and verify pinned modules
        run: |
          go mod download
          go mod verify
      # Genuine Core tests require separately provisioned, pinned binaries.
      # They skip on this unit/race lane and retain their regtest evidence lane.
      - name: Vet, race tests and build
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -race ./...
          go build -trimpath ./...
          if [ -d cmd ]; then
            go build -trimpath -o "$RUNNER_TEMP/bin/" ./cmd/...
          fi
