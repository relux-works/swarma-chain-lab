name: Model proxy checks

env:
  GOWORK: 'off'

on:
  pull_request:
    paths:
      - 'experiments/station-lifecycle/**'
      - 'experiments/model-proxy/**'
      - 'experiments/rental-gateway/**'
      - 'experiments/rental/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/model-proxy.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/station-lifecycle/**'
      - 'experiments/model-proxy/**'
      - 'experiments/rental-gateway/**'
      - 'experiments/rental/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/model-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-proxy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Fetch and verify pinned module closure
        run: |
          for module in model-proxy station-lifecycle/gatewaybind; do
            (cd experiments/"$module" && go mod download && go mod verify)
          done
      - name: Vet, race tests, build and guard controls
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          for module in model-proxy station-lifecycle/gatewaybind; do
            (cd experiments/"$module" && go vet ./... && go test -race -count=1 ./... && go build ./...)
          done
          cd experiments/model-proxy
          go run .scripts/guards.go -out .temp/guards
