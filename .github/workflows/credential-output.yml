name: Credential output guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-output:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.10'
          check-latest: false
          cache: false
      - name: Check tree-wide credential inventory
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: go run .scripts/check-credential-output-boundaries.go
