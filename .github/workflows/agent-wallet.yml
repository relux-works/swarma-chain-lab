name: Agent wallet checks
on:
  pull_request:
    paths:
      - 'experiments/agent-wallet/**'
      - 'experiments/rental/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/agent-wallet.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/agent-wallet/**'
      - 'experiments/rental/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/agent-wallet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wallet:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/agent-wallet
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Require integrated K1 dependency
        run: test -f ../rental/landlord_resolver.go && test -f ../single-use/observation.go
      - name: Verify pinned dependencies
        run: |
          go mod download
          go mod verify
      - name: Unit, durable state and protocol checks
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath ./cmd/agent-wallet
