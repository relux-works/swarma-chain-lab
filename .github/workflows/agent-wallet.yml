name: Agent wallet checks
on:
  pull_request:
    paths:
      - 'experiments/agent-wallet/**'
      - 'experiments/rental/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/agent-wallet.yml'
      - '.scripts/check-px1-core-gate.py'
      - '.scripts/test_check_px1_core_gate.py'
      - '.scripts/px1-core-gate.json'
      - '.scripts/w2-core-gate.json'
      - '.scripts/rt-grant-fixture-core-gate.json'
      - '.scripts/w2-newcore-users.go'
      - '.scripts/px1-s5-consumer-gate.json'
      - 'deploy/**'
  push:
    branches: [main]
    paths:
      - 'experiments/agent-wallet/**'
      - 'experiments/rental/**'
      - 'experiments/rental-booking/**'
      - 'experiments/payment-chain/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/agent-wallet.yml'
      - '.scripts/check-px1-core-gate.py'
      - '.scripts/test_check_px1_core_gate.py'
      - '.scripts/px1-core-gate.json'
      - '.scripts/w2-core-gate.json'
      - '.scripts/rt-grant-fixture-core-gate.json'
      - '.scripts/w2-newcore-users.go'
      - '.scripts/px1-s5-consumer-gate.json'
      - 'deploy/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wallet:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/agent-wallet
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Require integrated K1 dependency
        run: test -f ../rental/landlord_resolver.go && test -f ../single-use/observation.go
      - name: Verify pinned dependencies
        run: |
          go mod download
          go mod verify
      - name: Unit, durable state and protocol checks
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath ./cmd/agent-wallet
          go build -trimpath ./cmd/agent-walletd
          go build -trimpath ./cmd/agent-wallet-legacy

  # PX1 gate of record: every T1-T17 test of .scripts/px1-core-gate.json on a
  # genuine Namecoin Core 28.0 regtest node (the official release, verified
  # against the upstream SHA256SUMS and the repository pin), with `go test
  # -json`. Each T-id declares its required layers (unit, Core) as the PX1
  # test table says; an open T-id, a required layer without a test, a skip,
  # a failure, a missing test or a short repetition count fails the job. T9
  # runs as the table says: -race -count=50.
  px1-core-gate:
    name: px1-core-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: experiments/agent-wallet
    env:
      NMC_ARCHIVE: namecoin-28.0-x86_64-linux-gnu.tar.gz
      NMC_URL: https://www.namecoin.org/files/namecoin-core/namecoin-core-28.0/namecoin-28.0-x86_64-linux-gnu.tar.gz
      # Upstream release SHA256SUMS: the Guix attestations of three builders
      # in namecoin/guix.sigs, pinned to one commit.
      NMC_SUMS_BASE: https://raw.githubusercontent.com/namecoin/guix.sigs/9a4df23a6ce1ab79b140e7d16f914881e5de406e/28.0
      # Recorded in this repository (experiments/fullnode-trusts/README.md,
      # px1CorePins in px1_fixture_test.go).
      NMC_ARCHIVE_SHA256: 6f12031926f0999b8507e073648cc2b4488d452531301a2244a562a92f2f7860
      NMC_DAEMON_SHA256: dc7430676e445af3992430e036f7c1a17bea44f757e9cf25b69205e39625f2f7
      NMC_CLI_SHA256: 318b6c881c8071abbafd984550172369c3498b4c65c389797350f2d458f085b1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Require integrated K1 dependency
        run: test -f ../rental/landlord_resolver.go && test -f ../single-use/observation.go
      - name: Verify pinned dependencies
        run: |
          go mod download
          go mod verify
      - name: Gate checker controls (a skipped required T-id must fail the gate)
        working-directory: .
        run: python3 -B -m unittest discover -s .scripts -p 'test_check_px1_core_gate.py' -v
      - name: Fetch and verify Namecoin Core 28.0 (upstream SHA256SUMS and repository pin)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir nmc-core && cd nmc-core
          curl -fsSL --retry 3 --max-time 900 -o "$NMC_ARCHIVE" "$NMC_URL"
          for signer in 'Robert%20Mindo' 'Rose%20Turing' 'mjgill89'; do
            sums="sums-${signer%%\%*}.txt"
            curl -fsSL --retry 3 --max-time 60 -o "$sums" "$NMC_SUMS_BASE/$signer/noncodesigned.SHA256SUMS"
            # Each attestation names this archive once, with the repository pin.
            test "$(grep -c "  $NMC_ARCHIVE\$" "$sums")" = 1
            grep -qx "$NMC_ARCHIVE_SHA256  $NMC_ARCHIVE" "$sums"
            grep -x "[0-9a-f]\{64\}  $NMC_ARCHIVE" "$sums" | sha256sum -c -
          done
          mkdir x && tar -C x -xzf "$NMC_ARCHIVE"
          echo "$NMC_DAEMON_SHA256  x/namecoin-28.0/bin/namecoind" | sha256sum -c -
          echo "$NMC_CLI_SHA256  x/namecoin-28.0/bin/namecoin-cli" | sha256sum -c -
          echo "W1_CORE_DAEMON=$PWD/x/namecoin-28.0/bin/namecoind" >> "$GITHUB_ENV"
          echo "W1_CORE_CLI=$PWD/x/namecoin-28.0/bin/namecoin-cli" >> "$GITHUB_ENV"
      - name: Regtest standing-grant fixture through the installed G2 service (must run, no skip)
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          set +e
          name=TestRTGrantFixtureCore
          manifest=../../.scripts/rt-grant-fixture-core-gate.json
          checker=../../.scripts/check-px1-core-gate.py
          env -u W1_REGTEST go test -count=1 -json -run "^${name}$" . > "$RUNNER_TEMP/rt-fixture-control.json"
          control_test=$?
          python3 -B "$checker" check --manifest "$manifest" "$RUNNER_TEMP/rt-fixture-control.json" > "$RUNNER_TEMP/rt-fixture-control.txt"
          control_gate=$?
          grep -qx "SKIPPED $name" "$RUNNER_TEMP/rt-fixture-control.txt"
          skip_seen=$?
          W1_REGTEST=1 W1_RUN_ROOT="$RUNNER_TEMP/rt-grant-fixture-core" go test -count=1 -timeout 20m -json -run "^${name}$" . > "$RUNNER_TEMP/rt-fixture-core.json"
          code=$?
          python3 -B "$checker" check --manifest "$manifest" "$RUNNER_TEMP/rt-fixture-core.json"
          gate=$?
          echo "RT_GRANT_FIXTURE: skip control test=$control_test gate=$control_gate skip=$skip_seen; real Core test=$code gate=$gate"
          test "$control_test" = 0 && test "$control_gate" = 1 && test "$skip_seen" = 0 && test "$code" = 0 && test "$gate" = 0
      - name: Gate control on a real skip (without W1_REGTEST the Core test skips and the gate must fail)
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          set +e
          go test -count=1 -json -run '^TestPX1CoreS1$' . > "$RUNNER_TEMP/px1-gate-control.json"
          test_exit=$?
          python3 -B ../../.scripts/check-px1-core-gate.py check --manifest ../../.scripts/px1-core-gate.json "$RUNNER_TEMP/px1-gate-control.json" > "$RUNNER_TEMP/px1-gate-control.txt"
          gate_exit=$?
          grep -x 'SKIPPED TestPX1CoreS1' "$RUNNER_TEMP/px1-gate-control.txt"
          skip_seen=$?
          echo "control: go test exit $test_exit (want 0), gate exit $gate_exit (want 1), skip reported $skip_seen (want 0)"
          test "$test_exit" = 0 && test "$gate_exit" = 1 && test "$skip_seen" = 0
      # T18 node policy: TestPX1T18CoreNodePolicy lives in the deploy module and
      # needs W1_REGTEST=1 with the Core 28 binaries verified above. It runs
      # here, on those binaries, with `go test -json`; the step fails unless the
      # stream shows that exact test ran and passed, with no skip and no
      # failure. Control first: without W1_REGTEST the test skips, go test
      # exits 0, and the same check must fail on the skip.
      - name: Fetch and verify the deploy module dependencies (TestPX1T18CoreNodePolicy)
        working-directory: deploy
        run: |
          go mod download
          go mod verify
      - name: PX1 T18 Core node policy on Namecoin Core 28 regtest (deploy module, must run and pass, no skip allowed)
        working-directory: deploy
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          set +e
          name=TestPX1T18CoreNodePolicy
          ran_and_passed() {
            python3 -I -B -c '
          import json, sys
          path, name = sys.argv[1], sys.argv[2]
          actions = []
          with open(path, encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  e = json.loads(line)
                  if e.get("Test") != name:
                      continue
                  if e.get("Action") == "output":
                      print("  | " + e.get("Output", "").rstrip("\n"))
                  else:
                      actions.append(e.get("Action"))
          ok = actions.count("run") == 1 and actions.count("pass") == 1 and "skip" not in actions and "fail" not in actions
          print(("T18_NODE_POLICY RAN_AND_PASSED " if ok else "T18_NODE_POLICY NOT_PASSED ") + name + " actions=" + ",".join(actions))
          sys.exit(0 if ok else 1)
          ' "$1" "$name"
          }
          env -u W1_REGTEST go test -count=1 -json -run "^${name}\$" . > "$RUNNER_TEMP/t18-node-control.json" < /dev/null
          control_test=$?
          ran_and_passed "$RUNNER_TEMP/t18-node-control.json"
          control_gate=$?
          W1_REGTEST=1 W1_RUN_ROOT="$RUNNER_TEMP/t18-core-node" go test -count=1 -timeout 20m -json -run "^${name}\$" . > "$RUNNER_TEMP/t18-node.json" < /dev/null
          code=$?
          ran_and_passed "$RUNNER_TEMP/t18-node.json"
          gate=$?
          echo "control (no W1_REGTEST): go test exit $control_test (want 0), check exit $control_gate (want 1); W1_REGTEST=1: go test exit $code (want 0), check exit $gate (want 0)"
          test "$control_test" = 0 && test "$control_gate" = 1 && test "$code" = 0 && test "$gate" = 0
      - name: PX1 T1-T17 on Namecoin Core 28 regtest (go test -json, no skip allowed)
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
          W1_REGTEST: '1'
        run: |
          set +e
          manifest=../../.scripts/px1-core-gate.json
          checker=../../.scripts/check-px1-core-gate.py
          out="$RUNNER_TEMP/px1-gate"
          mkdir "$out" || exit 1
          status=0
          python3 -B "$checker" list --manifest "$manifest" core > "$RUNNER_TEMP/px1-core-list.txt" || exit 1
          unit=$(python3 -B "$checker" list --manifest "$manifest" unit | paste -sd '|') || exit 1
          test -s "$RUNNER_TEMP/px1-core-list.txt" && test -n "$unit" || exit 1
          # Each Core test starts its own node(s) under a fresh W1_RUN_ROOT,
          # with the go test flags the manifest names (default -count=1).
          while read -r name flags; do
            W1_RUN_ROOT="$RUNNER_TEMP/px1-core-$name" go test $flags -timeout 120m -json -run "^${name}\$" . > "$out/$name.json" < /dev/null
            code=$?
            echo "go test $name $flags exit $code"
            test "$code" = 0 || status=1
          done < "$RUNNER_TEMP/px1-core-list.txt"
          go test -count=1 -timeout 20m -json -run "^(${unit})\$" . > "$out/unit.json"
          code=$?
          echo "go test unit exit $code"
          test "$code" = 0 || status=1
          python3 -B "$checker" check --manifest "$manifest" "$out"/*.json
          gate=$?
          echo "gate exit $gate"
          test "$gate" = 0 || status=1
          exit "$status"
      - name: Gate control on a real skip before the passing streams (a skip anywhere must fail the gate)
        run: |
          set +e
          python3 -B ../../.scripts/check-px1-core-gate.py check --manifest ../../.scripts/px1-core-gate.json "$RUNNER_TEMP/px1-gate-control.json" "$RUNNER_TEMP"/px1-gate/*.json > "$RUNNER_TEMP/px1-gate-control-2.txt"
          gate_exit=$?
          grep -x 'SKIPPED TestPX1CoreS1' "$RUNNER_TEMP/px1-gate-control-2.txt"
          skip_seen=$?
          echo "control: real skip first, then the passing streams: gate exit $gate_exit (want 1), skip reported $skip_seen (want 0)"
          test "$gate_exit" = 1 && test "$skip_seen" = 0

  # W2 Core gate: every test using newCore, including signature-identity
  # regressions, is listed in .scripts/w2-core-gate.json and runs on the
  # same genuine Namecoin Core 28.0 regtest
  # node as px1-core-gate (the same archive, upstream SHA256SUMS and
  # repository pins, fetched by an identical step), with `go test -json` and
  # the same checker. A failure, a skip anywhere or a missing listed test
  # fails the job. Controls: a real skip (no W1_REGTEST) fails the checker,
  # alone and beside the passing streams; and one W2 plant of
  # testdata/service-mutations.json, applied to a copy of the tree, must fail
  # the checker beside the 24 real passing streams.
  w2-core:
    name: w2-core
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: experiments/agent-wallet
    env:
      NMC_ARCHIVE: namecoin-28.0-x86_64-linux-gnu.tar.gz
      NMC_URL: https://www.namecoin.org/files/namecoin-core/namecoin-core-28.0/namecoin-28.0-x86_64-linux-gnu.tar.gz
      # Upstream release SHA256SUMS: the Guix attestations of three builders
      # in namecoin/guix.sigs, pinned to one commit.
      NMC_SUMS_BASE: https://raw.githubusercontent.com/namecoin/guix.sigs/9a4df23a6ce1ab79b140e7d16f914881e5de406e/28.0
      # Recorded in this repository (experiments/fullnode-trusts/README.md,
      # px1CorePins in px1_fixture_test.go).
      NMC_ARCHIVE_SHA256: 6f12031926f0999b8507e073648cc2b4488d452531301a2244a562a92f2f7860
      NMC_DAEMON_SHA256: dc7430676e445af3992430e036f7c1a17bea44f757e9cf25b69205e39625f2f7
      NMC_CLI_SHA256: 318b6c881c8071abbafd984550172369c3498b4c65c389797350f2d458f085b1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Require integrated K1 dependency
        run: test -f ../rental/landlord_resolver.go && test -f ../single-use/observation.go
      - name: Verify pinned dependencies
        run: |
          go mod download
          go mod verify
      - name: Gate checker controls (known-bad W2 streams must fail the gate)
        working-directory: .
        run: python3 -B -m unittest discover -s .scripts -p 'test_check_px1_core_gate.py' -v
      - name: Fetch and verify Namecoin Core 28.0 (upstream SHA256SUMS and repository pin)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir nmc-core && cd nmc-core
          curl -fsSL --retry 3 --max-time 900 -o "$NMC_ARCHIVE" "$NMC_URL"
          for signer in 'Robert%20Mindo' 'Rose%20Turing' 'mjgill89'; do
            sums="sums-${signer%%\%*}.txt"
            curl -fsSL --retry 3 --max-time 60 -o "$sums" "$NMC_SUMS_BASE/$signer/noncodesigned.SHA256SUMS"
            # Each attestation names this archive once, with the repository pin.
            test "$(grep -c "  $NMC_ARCHIVE\$" "$sums")" = 1
            grep -qx "$NMC_ARCHIVE_SHA256  $NMC_ARCHIVE" "$sums"
            grep -x "[0-9a-f]\{64\}  $NMC_ARCHIVE" "$sums" | sha256sum -c -
          done
          mkdir x && tar -C x -xzf "$NMC_ARCHIVE"
          echo "$NMC_DAEMON_SHA256  x/namecoin-28.0/bin/namecoind" | sha256sum -c -
          echo "$NMC_CLI_SHA256  x/namecoin-28.0/bin/namecoin-cli" | sha256sum -c -
          echo "W1_CORE_DAEMON=$PWD/x/namecoin-28.0/bin/namecoind" >> "$GITHUB_ENV"
          echo "W1_CORE_CLI=$PWD/x/namecoin-28.0/bin/namecoin-cli" >> "$GITHUB_ENV"
      - name: Gate control on a real skip (without W1_REGTEST a W2 Core test skips and the gate must fail)
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          set +e
          go test -count=1 -json -run '^TestCoreActionStanding$' . > "$RUNNER_TEMP/w2-gate-control.json"
          test_exit=$?
          python3 -B ../../.scripts/check-px1-core-gate.py check --manifest ../../.scripts/w2-core-gate.json "$RUNNER_TEMP/w2-gate-control.json" > "$RUNNER_TEMP/w2-gate-control.txt"
          gate_exit=$?
          grep -x 'SKIPPED TestCoreActionStanding' "$RUNNER_TEMP/w2-gate-control.txt"
          skip_seen=$?
          echo "control: go test exit $test_exit (want 0), gate exit $gate_exit (want 1), skip reported $skip_seen (want 0)"
          test "$test_exit" = 0 && test "$gate_exit" = 1 && test "$skip_seen" = 0
      - name: W2 Core tests on Namecoin Core 28 regtest (go test -json, no skip allowed)
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
          W1_REGTEST: '1'
        run: |
          set +e
          manifest=../../.scripts/w2-core-gate.json
          checker=../../.scripts/check-px1-core-gate.py
          out="$RUNNER_TEMP/w2-gate"
          mkdir "$out" || exit 1
          status=0
          python3 -B "$checker" list --manifest "$manifest" core > "$RUNNER_TEMP/w2-core-list.txt" || exit 1
          test -s "$RUNNER_TEMP/w2-core-list.txt" || exit 1
          # Each Core test starts its own node under a fresh W1_RUN_ROOT.
          while read -r name flags; do
            W1_RUN_ROOT="$RUNNER_TEMP/w2-core-$name" go test $flags -timeout 20m -json -run "^${name}\$" . > "$out/$name.json" < /dev/null
            code=$?
            echo "go test $name $flags exit $code"
            test "$code" = 0 || status=1
          done < "$RUNNER_TEMP/w2-core-list.txt"
          python3 -B "$checker" check --manifest "$manifest" "$out"/*.json
          gate=$?
          echo "gate exit $gate"
          test "$gate" = 0 || status=1
          exit "$status"
      - name: Gate control on a real skip beside the passing streams (a skip anywhere must fail the gate)
        run: |
          set +e
          python3 -B ../../.scripts/check-px1-core-gate.py check --manifest ../../.scripts/w2-core-gate.json "$RUNNER_TEMP/w2-gate-control.json" "$RUNNER_TEMP"/w2-gate/*.json > "$RUNNER_TEMP/w2-gate-control-2.txt"
          gate_exit=$?
          grep -x 'SKIPPED TestCoreActionStanding' "$RUNNER_TEMP/w2-gate-control-2.txt"
          skip_seen=$?
          echo "control: real skip first, then the passing streams: gate exit $gate_exit (want 1), skip reported $skip_seen (want 0)"
          test "$gate_exit" = 1 && test "$skip_seen" = 0
      # Planted control: the action-final-authority row of
      # testdata/service-mutations.json (the payment executes despite a
      # post-reservation revocation) is applied to a copy of the tree exactly
      # as TestGuardPlants applies it (its Old text occurs once in its File).
      # Its selector, TestCoreActionFinalCheck, runs on a fresh regtest root in
      # that copy, and its stream replaces the real one beside the other 22
      # real passing streams: the checker must fail on that test alone
      # (FAILED and REQUIRED_FAILED, no missing or skipped test), the stream
      # must carry the plant's marker, and the unplanted neighbour (the real
      # 23 streams) must pass.
      - name: Planted W2 defect must fail the gate (action-final-authority on a copy of the tree)
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
          W1_REGTEST: '1'
          W2_PLANT: action-final-authority
        run: |
          set +e
          manifest=../../.scripts/w2-core-gate.json
          checker=../../.scripts/check-px1-core-gate.py
          tree="$RUNNER_TEMP/w2-plant"
          mkdir "$tree" || exit 1
          cp -a ../../experiments "$tree/experiments" || exit 1
          python3 -I -B -c '
          import json, sys
          module, name = sys.argv[1], sys.argv[2]
          with open(module + "/testdata/service-mutations.json", encoding="utf-8") as f:
              rows = [r for r in json.load(f) if r["Name"] == name]
          assert len(rows) == 1 and rows[0].get("Core") is True, "one Core plant row"
          r = rows[0]
          path = module + "/" + r["File"]
          with open(path, encoding="utf-8") as f:
              src = f.read()
          assert src.count(r["Old"]) == 1, "plant guard not uniquely applied"
          with open(path, "w", encoding="utf-8") as f:
              f.write(src.replace(r["Old"], r["New"], 1))
          print(r["Selector"] + "\t" + r["Marker"])
          ' "$tree/experiments/agent-wallet" "$W2_PLANT" > "$RUNNER_TEMP/w2-plant-row.txt" || exit 1
          selector=$(cut -f1 "$RUNNER_TEMP/w2-plant-row.txt")
          marker=$(cut -f2 "$RUNNER_TEMP/w2-plant-row.txt")
          echo "plant $W2_PLANT: selector $selector, marker: $marker"
          test "$selector" = TestCoreActionFinalCheck || exit 1
          diff -r ../../experiments "$tree/experiments"
          changed=$(diff -rq ../../experiments "$tree/experiments" | wc -l)
          (cd "$tree/experiments/agent-wallet" && W1_RUN_ROOT="$RUNNER_TEMP/w2-plant-core" go test -count=1 -timeout 20m -json -run "^${selector}\$" . > "$RUNNER_TEMP/w2-plant.json" < /dev/null)
          test_exit=$?
          others=()
          for f in "$RUNNER_TEMP"/w2-gate/*.json; do
            test "$f" = "$RUNNER_TEMP/w2-gate/$selector.json" || others+=("$f")
          done
          python3 -B "$checker" check --manifest "$manifest" "$RUNNER_TEMP/w2-plant.json" "${others[@]}" > "$RUNNER_TEMP/w2-plant-gate.txt"
          gate_exit=$?
          cat "$RUNNER_TEMP/w2-plant-gate.txt"
          grep -qx "FAILED $selector" "$RUNNER_TEMP/w2-plant-gate.txt"
          failed_seen=$?
          grep -qx "REQUIRED_FAILED W2-${selector#Test} $selector" "$RUNNER_TEMP/w2-plant-gate.txt"
          required_seen=$?
          other=$(grep -c '^REQUIRED_\(MISSING\|SKIPPED\) ' "$RUNNER_TEMP/w2-plant-gate.txt")
          python3 -I -B -c '
          import json, sys
          path, test, marker = sys.argv[1:]
          with open(path, encoding="utf-8") as f:
              events = [json.loads(line) for line in f.read().splitlines() if line.strip()]
          out = "".join(e.get("Output", "") for e in events if (e.get("Test") or "").split("/")[0] == test)
          sys.exit(0 if marker in out else 1)
          ' "$RUNNER_TEMP/w2-plant.json" "$selector" "$marker"
          marker_seen=$?
          python3 -B "$checker" check --manifest "$manifest" "${others[@]}" "$RUNNER_TEMP/w2-gate/$selector.json" > "$RUNNER_TEMP/w2-plant-neighbour.txt"
          neighbour_exit=$?
          tail -1 "$RUNNER_TEMP/w2-plant-neighbour.txt"
          echo "plant control: files changed $changed (want 1), others ${#others[@]} (want 22), go test exit $test_exit (want 1), gate exit $gate_exit (want 1), FAILED seen $failed_seen (want 0), REQUIRED_FAILED seen $required_seen (want 0), missing or skipped $other (want 0), marker seen $marker_seen (want 0), unplanted neighbour gate exit $neighbour_exit (want 0)"
          test "$changed" = 1 && test "${#others[@]}" = 22 && test "$test_exit" = 1 && test "$gate_exit" = 1 && test "$failed_seen" = 0 && test "$required_seen" = 0 && test "$other" = 0 && test "$marker_seen" = 0 && test "$neighbour_exit" = 0
