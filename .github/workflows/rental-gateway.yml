name: Rental gateway checks

env:
  GOWORK: 'off'

on:
  pull_request:
    paths:
      - 'experiments/rental-gateway/**'
      - 'experiments/rental/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/rental-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/rental-gateway/**'
      - 'experiments/rental/**'
      - 'experiments/single-use/**'
      - 'experiments/sealwatch/**'
      - '.github/workflows/rental-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/rental-gateway
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Fetch and verify pinned modules
        run: |
          go mod download
          go mod verify
      - name: Vet, race tests and build
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -race ./...
          go build -trimpath -o "$RUNNER_TEMP/bin/" ./cmd/...

  kernelbind:
    # The nested module binds the landed K1 v3 kernel
    # (experiments/rental) via in-tree replaces.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/rental-gateway/kernelbind
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false
      - name: Fetch and verify pinned modules
        run: |
          go mod download
          go mod verify
      # The genuine-Core e2e stays opt-in (GW_E2E_REGTEST=1) and
      # skips here; unit tests cover the binding and receipt mapping.
      - name: Vet, race tests and build
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -race ./...
          go build -trimpath ./...
